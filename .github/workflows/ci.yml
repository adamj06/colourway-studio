name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guardrail tests (the hooks are code too)
        run: node --test ".claude/hooks/tests/*.test.mjs"
      - name: Formatting (Prettier)
        run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (coverage thresholds enforced in vitest config)
        run: npm run test -- --coverage
      - run: npm run build
      - name: Bundle size budget
        run: npx size-limit

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Uploaded on every run, so this job must NEVER receive VERCEL_AUTOMATION_BYPASS_SECRET (reports can echo
      # request details). The secret is only passed to smoke.yml, which uploads nothing.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Semgrep
        run: pipx run semgrep scan --config p/typescript --config p/nextjs --error
