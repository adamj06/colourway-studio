name: Claude PR review

# Second-opinion review on every PR, from a fresh context with no knowledge of how the code was written.
# Setup:
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Run `claude setup-token` locally and save the result as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
# The action exchanges a GitHub OIDC token for an app token, which is why id-token: write is required.
# Dependabot runs never receive repo secrets, so they're skipped.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR against CLAUDE.md. Focus on correctness, test quality (would the tests catch a broken implementation?),
            security of the V&A proxy (SSRF, validation) and XSS. Post one concise review comment with Must fix / Should fix items
            and file:line references. Don't suggest style nits that the linter already covers.
          claude_args: '--model sonnet --max-turns 15'
