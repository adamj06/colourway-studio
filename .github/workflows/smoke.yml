name: Post-deploy smoke test

# Runs after every successful Vercel deployment (preview and production) against the real URL.
# Proves the deployed app works, not just the build.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests against the deployment
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # "Production" or "Preview": on production the header test also asserts HSTS and upgrade-insecure-requests.
          DEPLOY_ENV: ${{ github.event.deployment_status.environment }}
          # The bypass secret is only ever sent to https://*.vercel.app or a host listed here (tests/e2e/trusted-origin.ts).
          # Add the production domain here once there is one.
          BYPASS_ALLOWED_HOSTS: ''
          # Needed only if Vercel Deployment Protection is on for previews (Vercel project > Settings > Deployment Protection).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::The deployment event has no environment_url, so there is nothing to smoke test."
            exit 1
          fi
          npx playwright test --grep @smoke
